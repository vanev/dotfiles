# ==============================================================================
# tmux config
# One SSH connection, N panes/windows. Prefix is Ctrl-a (screen-style).
# ==============================================================================

# ------------------------------------------------------------------------------
# PREFIX
# ------------------------------------------------------------------------------
# Ctrl-b requires an awkward reach; Ctrl-a is the classic screen-style remap.
# Double-tap (Ctrl-a Ctrl-a) sends a literal Ctrl-a through to the shell/app,
# e.g. for readline's "jump to beginning of line" or a nested tmux session.
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# ------------------------------------------------------------------------------
# GENERAL BEHAVIOR
# ------------------------------------------------------------------------------
# No delay after Esc - matters a lot for nvim, which otherwise waits to see
# if Esc is the start of an arrow-key/meta sequence before leaving insert mode.
set -sg escape-time 0

# True color support so nvim's colorscheme renders correctly inside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*256col*:Tc'

# Start windows/panes at 1, not 0 - easier to reach on a keyboard than 0.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Way more scrollback than the 2000-line default.
set -g history-limit 50000

# Let panes report focus in/out - lets vim/nvim autoread files changed
# in another pane (e.g. after `git checkout` in a sibling shell).
set -g focus-events on

# Let tmux ask the terminal to sync the system clipboard via OSC 52.
# Works over SSH as long as the local terminal supports OSC 52
# (iTerm2, kitty, wezterm, alacritty, Windows Terminal all do).
set -g set-clipboard on

# Mouse: click to select pane/window, drag to resize, wheel to scroll.
set -g mouse on

# ------------------------------------------------------------------------------
# SPLITS & WINDOWS
# ------------------------------------------------------------------------------
# Intuitive split bindings that mirror the shape of the split, and open the
# new pane/window in the current pane's working directory instead of $HOME.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ------------------------------------------------------------------------------
# PANE NAVIGATION (vim-tmux-navigator, tmux side)
# ------------------------------------------------------------------------------
# Ctrl-h/j/k/l move between panes, matching the Ctrl-h/j/k/l window-navigation
# keys already bound in nvim. When the current pane is running (n)vim, the
# keystroke is instead forwarded to it, so vim's own split navigation still
# works and, at the edge of vim's splits, control passes through to tmux.
# The nvim-side complement (vim-tmux-navigator plugin) lives in nvim/init.lua.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Resize panes with prefix + shifted hjkl (repeatable without re-pressing prefix).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ------------------------------------------------------------------------------
# COPY MODE
# ------------------------------------------------------------------------------
# vi-style keys in copy mode: v to start a selection, y to copy, matching
# vim's own visual-mode muscle memory.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ------------------------------------------------------------------------------
# STATUS BAR
# ------------------------------------------------------------------------------
# 'default' inherits the terminal's own background/foreground instead of a
# fixed 256-color palette entry, so this follows whatever theme the terminal
# is set to rather than looking the same everywhere. Bold is used instead of
# a fixed accent color to pick out the active window/pane border.
set -g status-position bottom
set -g status-style 'default'
set -g status-left-length 20
set -g status-left ' #[bold]#S #[nobold]| '
set -g status-right ''
set -g window-status-current-style 'bold'
set -g pane-border-style 'fg=default'
set -g pane-active-border-style 'fg=default,bold'

# ------------------------------------------------------------------------------
# MISC
# ------------------------------------------------------------------------------
# Reload this file without restarting the session.
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
